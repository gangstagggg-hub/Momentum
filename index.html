<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Momentum</title>
<meta name="description" content="Momentum – din personlige treningslogg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e0f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Momentum">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Bebas+Neue&family=Space+Grotesk:wght@600;700&family=Unbounded:wght@700;800&family=Archivo+Black&family=Sora:wght@700;800&family=Cabinet+Grotesk:wght@700&family=Monument+Extended:wght@700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@700&f[]=general-sans@700&f[]=satoshi@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f12;
    --bg-elevated: #16181d;
    --bg-card: #1b1e24;
    --border: #2a2d34;
    --text: #f1f2f4;
    --text-dim: #8b8f98;
    --accent: #7c9eff;
    --accent-dim: #3a4b7a;
    --danger: #ff6b6b;
    --radius: 16px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    padding-bottom: 100px;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: linear-gradient(180deg, var(--bg) 80%, transparent);
    padding: 28px 20px 16px;
  }

  header h1 {
    font-family: 'Monument Extended', 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.04em;
    line-height: 1.2;
    color: var(--text);
  }

  header p {
    margin: 18px 0 0;
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 0.01em;
  }

  .hero {
    position: relative;
  }

  .momentum-wrap {
    position: relative;
    display: inline-block;
  }

  .hero-line {
    position: absolute;
    bottom: -8px;
    left: 0;
    width: 22px;
    height: 2px;
    background: var(--accent);
    border-radius: 2px;
    animation: lineBounce 3.4s ease-in-out infinite;
  }

  @keyframes lineBounce {
    0%   { left: 0; transform: scaleX(1); }
    40%  { left: calc(100% - 22px); transform: scaleX(1); }
    45%  { left: calc(100% - 22px); transform: scaleX(0.55); }
    50%  { left: calc(100% - 22px); transform: scaleX(1); }
    90%  { left: 0; transform: scaleX(1); }
    95%  { left: 0; transform: scaleX(0.55); }
    100% { left: 0; transform: scaleX(1); }
  }

  .letter-n {
    display: inline-block;
    transform: scaleX(-1);
  }

  #exercise-list {
    padding: 8px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-size: 14px;
    line-height: 1.6;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    gap: 14px;
    align-items: center;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease;
    user-select: none;
  }

  .card:active {
    transform: scale(0.985);
    border-color: #3a3e47;
  }

  .card.holding {
    border-color: var(--accent);
    transform: scale(0.97);
    transition: border-color 1s linear, transform 0.2s ease;
  }

  .card-thumb {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    background: var(--bg-elevated);
    flex-shrink: 0;
    object-fit: cover;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 18px;
    overflow: hidden;
  }

  .card-thumb img { width: 100%; height: 100%; object-fit: cover; }

  .card-body { flex: 1; min-width: 0; }

  .card-title {
    font-weight: 600;
    font-size: 16px;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-meta {
    display: flex;
    gap: 10px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .card-meta span b { color: var(--accent); font-weight: 600; }

  .card-comment {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-date {
    font-size: 11px;
    color: #565a63;
    margin-top: 6px;
  }

  #installBanner {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 16px;
    max-width: 448px;
    margin: 0 auto;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 14px 14px 16px;
    display: none;
    align-items: center;
    gap: 12px;
    z-index: 40;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
  }
  #installBanner.show { display: flex; }
  #installText {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  #installText strong {
    font-size: 14px;
    font-weight: 700;
  }
  #installText span {
    font-size: 12px;
    color: var(--text-dim);
  }
  #installBtn {
    background: var(--accent);
    color: #0e0f12;
    border: none;
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  #installDismiss {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
    padding: 4px;
  }

  #fab {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(calc(-50% + 0px));
    margin-left: 0;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--accent);
    color: #0e0f12;
    border: none;
    font-size: 28px;
    font-weight: 400;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(124, 158, 255, 0.35);
    cursor: pointer;
    z-index: 20;
    transition: transform 0.15s ease;
  }
  #fab:active { transform: translateX(0) scale(0.92); }

  /* Overlay + sheet */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #overlay.show { opacity: 1; pointer-events: auto; }

  #sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: 64px; /* leaves top visible */
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg-elevated);
    border-radius: 24px 24px 0 0;
    z-index: 31;
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(.32,.72,0,1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--border);
    border-bottom: none;
  }
  #sheet.show { transform: translateY(0); }
  #sheet.dragging { transition: none; }

  .sheet-handle-wrap {
    padding: 10px 0 6px;
    display: flex;
    justify-content: center;
    cursor: grab;
    flex-shrink: 0;
    touch-action: none;
  }
  .sheet-handle {
    width: 40px;
    height: 5px;
    border-radius: 3px;
    background: #3c4048;
  }

  .sheet-header {
    padding: 4px 22px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .sheet-header h2 {
    font-size: 19px;
    margin: 0;
    font-weight: 700;
  }
  .sheet-header .close-x {
    color: var(--text-dim);
    font-size: 15px;
    background: var(--bg-card);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
  }

  .sheet-content {
    padding: 4px 22px 32px;
    overflow-y: auto;
    flex: 1;
  }

  .field {
    margin-bottom: 18px;
  }
  .field label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 7px;
    font-weight: 500;
  }
  .field label .req { color: var(--accent); }
  .field label .opt { color: #565a63; font-weight: 400; }

  .field input[type="text"],
  .field input[type="number"],
  .field textarea {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 14px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .field input:focus, .field textarea:focus {
    border-color: var(--accent);
  }
  .field input:disabled, .field textarea:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .field textarea {
    resize: none;
    min-height: 70px;
  }

  .row-2 {
    display: flex;
    gap: 12px;
  }
  .row-2 .field { flex: 1; }

  .img-buttons {
    display: flex;
    gap: 10px;
  }
  .img-btn {
    flex: 1;
    background: var(--bg-card);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .img-btn:active { border-color: var(--accent); color: var(--text); }
  .img-btn svg { width: 20px; height: 20px; }

  .img-preview {
    position: relative;
    margin-top: 12px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .img-preview img { width: 100%; display: block; max-height: 180px; object-fit: cover; }
  .img-preview .remove-img {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.6);
    border: none;
    color: white;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
  }

  .save-btn {
    width: 100%;
    background: var(--accent);
    color: #0e0f12;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .save-btn:active { transform: scale(0.98); }
  .save-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .pr-note {
    font-size: 12px;
    color: var(--text-dim);
    background: var(--bg-card);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 18px;
    line-height: 1.5;
  }
  .pr-note b { color: var(--accent); }

  .error-text {
    color: var(--danger);
    font-size: 12px;
    margin-top: 6px;
    min-height: 14px;
  }

  /* --- Øvelse: velg fra liste + forklaring --- */
  .name-row {
    display: flex;
    gap: 8px;
  }
  .name-row input { flex: 1; }
  .icon-btn {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-dim);
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .icon-btn:active { border-color: var(--accent); color: var(--accent); }

  .suggestion-text {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: 8px;
    line-height: 1.5;
  }
  .suggestion-text b {
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .explain-btn {
    width: 100%;
    margin-top: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: opacity 0.15s ease, border-color 0.15s ease;
  }
  .explain-btn:disabled {
    opacity: 0.35;
    color: var(--text-dim);
    cursor: not-allowed;
  }
  .explain-btn:not(:disabled):active { border-color: var(--accent); }

  /* --- Picker sheet (velg øvelse) --- */
  #pickerOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 41;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #pickerOverlay.show { opacity: 1; pointer-events: auto; }

  #pickerSheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: 64px;
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg-elevated);
    border-radius: 24px 24px 0 0;
    z-index: 42;
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(.32,.72,0,1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--border);
    border-bottom: none;
  }
  #pickerSheet.show { transform: translateY(0); }
  #pickerSheet.dragging { transition: none; }

  #pickerList {
    padding: 4px 22px 32px;
    overflow-y: auto;
    flex: 1;
  }
  .picker-item {
    padding: 14px 2px;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .picker-item:last-child { border-bottom: none; }
  .picker-item:active { color: var(--accent); }

  /* --- Forklaringsmodal --- */
  #explainOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 51;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  #explainOverlay.show { opacity: 1; pointer-events: auto; }

  #explainModal {
    position: fixed;
    left: 20px;
    right: 20px;
    top: 50%;
    max-width: 440px;
    margin: 0 auto;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 20px;
    z-index: 52;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translate(0, -50%) scale(0.94);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  #explainModal.show {
    transform: translate(0, -50%) scale(1);
    opacity: 1;
    pointer-events: auto;
  }
  .explain-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 20px 14px;
    flex-shrink: 0;
  }
  .explain-header h2 {
    font-size: 18px;
    margin: 0;
    font-weight: 700;
  }
  .explain-body {
    padding: 0 20px 22px;
    overflow-y: auto;
  }
  .explain-section { margin-bottom: 16px; }
  .explain-section:last-child { margin-bottom: 0; }
  .explain-label {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin: 0 0 6px;
    font-weight: 700;
  }
  .explain-section p:not(.explain-label) {
    font-size: 14px;
    line-height: 1.55;
    color: var(--text);
    margin: 0;
  }

  /* --- Header topp-rad med nav-knapp --- */
  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .nav-icon-btn {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .nav-icon-btn:active { border-color: var(--accent); }

  .back-btn {
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    padding: 4px 6px 4px 0;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    transition: transform 0.15s ease, color 0.15s ease;
  }
  .back-btn:active {
    transform: translateX(-4px);
    color: var(--accent);
  }

  /* --- Muskelside --- */
  #musclePage {
    position: absolute;
    inset: 0;
    background: var(--bg);
    z-index: 15;
    display: none;
    flex-direction: column;
    min-height: 100vh;
    padding: 28px 20px 120px;
  }
  #musclePage.show { display: flex; }

  .muscle-page-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }
  .muscle-page-header h2 {
    font-size: 19px;
    margin: 0;
    font-weight: 700;
  }
  .muscle-page-header p {
    margin: 3px 0 0;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  .body-map-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .body-tab {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .body-tab.active {
    color: #0e0f12;
    background: var(--accent);
    border-color: var(--accent);
  }

  #bodyMapContainer {
    display: flex;
    justify-content: center;
    padding: 12px 0 8px;
  }
  .body-canvas {
    width: 100%;
    max-width: 240px;
    height: auto;
    border-radius: 12px;
  }

  .muscle-section-label {
    color: var(--text-dim);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 20px 0 12px;
  }

  #muscleButtons {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .muscle-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .muscle-card.pulse {
    border-color: var(--accent);
    transform: scale(0.98);
  }
  .muscle-name {
    font-size: 15px;
    font-weight: 600;
  }
  .muscle-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .muscle-minus {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .muscle-minus:active { border-color: var(--accent); color: var(--accent); }
  .muscle-count {
    min-width: 22px;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="header-top">
      <div class="hero">
        <div class="momentum-wrap">
          <h1>MOME<span class="letter-n">N</span>TUM</h1>
          <div class="hero-line"></div>
        </div>
      </div>
      <button id="musclesNavBtn" class="nav-icon-btn" aria-label="Muskelstatus">💪</button>
    </div>
    <p>Trykk og hold på en øvelse for å logge PR</p>
  </header>

  <div id="exercise-list"></div>
</div>

<div id="musclePage">
  <div class="muscle-page-header">
    <button id="backFromMuscles" class="back-btn" aria-label="Tilbake">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none">
        <path d="M19 12H5M5 12L11 6M5 12L11 18" stroke="currentColor" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
      </svg>
    </button>
    <div>
      <h2>Muskelstatus</h2>
      <p id="weekLabel">Uke</p>
    </div>
  </div>

  <div class="body-map-tabs">
    <button class="body-tab active" data-view="front">Front</button>

  function normalize(str) {
    return (str || '').trim().toLowerCase();
  }

  function findExactExercise(name) {
    const n = normalize(name);
    if (!n) return null;
    return EXERCISE_LIBRARY.find(e => normalize(e.name) === n) || null;
  }

  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    if (m === 0) return n;
    if (n === 0) return m;
    const dp = [];
    for (let i = 0; i <= m; i++) dp.push(new Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        dp[i][j] = a[i - 1] === b[j - 1]
          ? dp[i - 1][j - 1]
          : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
      }
    }
    return dp[m][n];
  }

  function findClosestExercise(name) {
    const n = normalize(name);
    if (n.length < 3) return null;
    let best = null;
    let bestDist = Infinity;
    EXERCISE_LIBRARY.forEach(e => {
      const d = levenshtein(n, normalize(e.name));
      if (d < bestDist) { bestDist = d; best = e; }
    });
    if (!best) return null;
    const threshold = Math.max(2, Math.floor(best.name.length * 0.3));
    return bestDist > 0 && bestDist <= threshold ? best : null;
  }

  function getWeekInfo(d = new Date()) {
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = (date.getUTCDay() + 6) % 7;
    date.setUTCDate(date.getUTCDate() - dayNum + 3);
    const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
    const weekNum = 1 + Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
    return { key: `${date.getUTCFullYear()}-U${String(weekNum).padStart(2, '0')}`, week: weekNum, year: date.getUTCFullYear() };
  }

  // Single red hue family: lighter red for lightly-trained muscles, deepening
  // toward a richer red the more a muscle has been trained. Always semi-transparent.
  function muscleTintColor(count) {
    if (!count) return null;
    const capped = Math.min(count, 6);
    const t = capped / 6;
    const shade = Math.round(210 - 150 * t); // 210 (light) -> 60 (dark)
    const alpha = (0.22 + 0.33 * t).toFixed(2); // 0.22 -> 0.55, always transparent
    return `rgba(255,${shade},${shade},${alpha})`;
  }

  function attachDoubleTap(el, callback) {
    let lastTap = 0;
    el.addEventListener('pointerup', (e) => {
      if (e.target.closest('.muscle-minus')) return;
      const now = Date.now();
      if (now - lastTap < 350) {
        callback();
        lastTap = 0;
      } else {
        lastTap = now;
      }
    });
  }

  function drawPolygon(ctx, points) {
    ctx.beginPath();
    points.forEach(([x, y], i) => {
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.closePath();
  }

  function drawSharpOutline(ctx, img, w, h) {
    const off = document.createElement('canvas');
    off.width = w;
    off.height = h;
    const octx = off.getContext('2d');
    octx.drawImage(img, 0, 0, w, h);
    octx.globalCompositeOperation = 'source-in';
    octx.fillStyle = 'rgba(0,0,0,1)';
    octx.fillRect(0, 0, w, h);

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,1)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    // Several passes build up a solid, evenly-blurred ring around the silhouette
    for (let i = 0; i < 5; i++) {
      ctx.drawImage(off, 0, 0);
    }
    ctx.restore();
  }

  function renderBodyMap(view, counts) {
    const [w, h] = PHOTO_SIZE[view];
    bodyMapContainer.innerHTML = '<canvas class="body-canvas"></canvas>';
    const canvas = bodyMapContainer.querySelector('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    if (!anatomyLoaded[view]) return;
    const img = ANATOMY_IMAGES[view];
    ctx.clearRect(0, 0, w, h);

    const layer = document.createElement('canvas');
    layer.width = w;
    layer.height = h;
    const lctx = layer.getContext('2d');
    lctx.drawImage(img, 0, 0, w, h);
    lctx.globalCompositeOperation = 'multiply';

    const svgRegions = view === 'front' ? FRONT_SVG_REGIONS : BACK_SVG_REGIONS;
    const svgC = view === 'front' ? FRONT_SVG_C : BACK_SVG_C;
    const svgF = view === 'front' ? FRONT_SVG_F : BACK_SVG_F;

    Object.keys(svgRegions).forEach(muscleId => {
      const color = muscleTintColor(counts[muscleId] || 0);
      if (!color) return;
      lctx.setTransform(SVG_TRANSFORM.a, SVG_TRANSFORM.b, 0, SVG_TRANSFORM.d, svgC, svgF);
      lctx.fillStyle = color;
      svgRegions[muscleId].forEach(d => {
        lctx.fill(new Path2D(d));
      });
    });
    lctx.setTransform(1, 0, 0, 1, 0, 0);

    lctx.globalCompositeOperation = 'destination-in';
    lctx.drawImage(img, 0, 0, w, h);
    lctx.globalCompositeOperation = 'source-over';

    // Sharp dark outline drawn first, then the tinted figure on top
    drawSharpOutline(ctx, img, w, h);
    ctx.drawImage(layer, 0, 0);
  }

      card.querySelector('.muscle-minus').addEventListener('click', (e) => {
        e.stopPropagation();

        c[m.id] = Math.max(0, (c[m.id] || 0) - 1);

      attachDoubleTap(card, () => {

        c[m.id] = (c[m.id] || 0) + 1;

      });
      muscleButtonsEl.appendChild(card);
    });
  }

  function formatDate(d) {
    return new Date(d).toLocaleDateString('no-NO', { day: '2-digit', month: 'short', year: 'numeric' }) +
      ' ' + new Date(d).toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });

  function capitalizeFirst(str) {
    if (!str) return str;
    return str.charAt(0).toUpperCase() + str.slice(1);

      attachLongPress(card, () => openEdit(ex.id));
      list.appendChild(card);

  function attachLongPress(el, callback, duration = 1000) {
    let timer = null;

    const start = (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      el.classList.add('holding');
      timer = setTimeout(() => {
        el.classList.remove('holding');
        if (navigator.vibrate) navigator.vibrate(15);
        callback();
      }, duration);
    };
    const cancel = () => {
      clearTimeout(timer);
      el.classList.remove('holding');
    };

    el.addEventListener('pointerdown', start);
    el.addEventListener('pointerup', cancel);
    el.addEventListener('pointerleave', cancel);
    el.addEventListener('pointercancel', cancel);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function resetForm() {
    fieldName.value = '';
    fieldReps.value = '';
    fieldWeight.value = '';
    fieldComment.value = '';
    currentImage = null;

    errorText.textContent = '';

    updateExerciseMatch();

  function updateExerciseMatch() {
    const val = fieldName.value;
    const exact = findExactExercise(val);
    if (exact) {
      selectedExercise = exact;
      explainBtn.disabled = false;
      suggestionText.style.display = 'none';
      suggestionText.innerHTML = '';
      return;
    }
    selectedExercise = null;
    explainBtn.disabled = true;
    const closest = findClosestExercise(val);
    if (closest) {
      suggestionText.style.display = 'block';
      suggestionText.innerHTML = `Mener du «<b id="suggestMatch">${escapeHtml(closest.name)}</b>»?`;
      const btn = document.getElementById('suggestMatch');
      btn.addEventListener('click', () => {
        fieldName.value = closest.name;
        updateExerciseMatch();
      });
    } else {
      suggestionText.style.display = 'none';
      suggestionText.innerHTML = '';
    }
  }

  function openEdit(id) {
    const ex = exercises.find(e => e.id === id);
    if (!ex) return;
    editingId = id;
    resetForm();
    fieldName.value = ex.name;
    fieldReps.value = ex.reps;

    fieldComment.value = ex.comment || '';
    currentImage = ex.image || null;

    // Kommentar og bilde settes kun ved opprettelse; navn kan endres når som helst
    fieldComment.disabled = true;
    imageField.style.display = 'none';

    sheetTitle.textContent = ex.name;
    prNote.style.display = 'block';
    prNote.innerHTML = `Registrer ny PR. <b>Navn</b>, <b>vekt</b> og <b>reps</b> kan endres — dato lagres automatisk.<br>Forrige PR: ${formatDate(ex.lastEdited)}`;

      reader.onload = (ev) => {

  // Sveip ned for å lukke (generisk, brukes av begge ark)
  function attachSwipeToClose(sheetEl, handleEl, closeFn) {
    let startY = 0, currentY = 0, dragging = false;

    function onDragStart(y) {
      dragging = true;
      startY = y;
      currentY = y;
      sheetEl.classList.add('dragging');
    }
    function onDragMove(y) {
      if (!dragging) return;
      currentY = y;
      const delta = Math.max(0, currentY - startY);
      sheetEl.style.transform = `translateY(${delta}px)`;
    }
    function onDragEnd() {
      if (!dragging) return;
      dragging = false;
      sheetEl.classList.remove('dragging');
      const delta = currentY - startY;
      sheetEl.style.transform = '';
      if (delta > 120) closeFn();
    }

    handleEl.addEventListener('touchstart', (e) => onDragStart(e.touches[0].clientY), { passive: true });
    handleEl.addEventListener('touchmove', (e) => onDragMove(e.touches[0].clientY), { passive: true });
    handleEl.addEventListener('touchend', onDragEnd);

    handleEl.addEventListener('mousedown', (e) => {
      onDragStart(e.clientY);
      const move = (ev) => onDragMove(ev.clientY);
      const up = () => {
        onDragEnd();
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
  }

  const dragHandle = document.getElementById('dragHandle');
  attachSwipeToClose(sheet, dragHandle, closeSheet);

  // --- Velg øvelse fra liste ---
  function renderPickerList() {
    pickerList.innerHTML = '';
    EXERCISE_LIBRARY.forEach(ex => {
      const item = document.createElement('div');
      item.className = 'picker-item';
      item.textContent = ex.name;
      item.addEventListener('click', () => {
        fieldName.value = ex.name;
        updateExerciseMatch();
        closePicker();
      });
      pickerList.appendChild(item);
    });
  }

  function openPicker() {
    renderPickerList();
    pickerOverlay.classList.add('show');
    pickerSheet.classList.add('show');
  }
  function closePicker() {
    pickerOverlay.classList.remove('show');
    pickerSheet.classList.remove('show');
  }

  pickExerciseBtn.addEventListener('click', openPicker);
  pickerCloseBtn.addEventListener('click', closePicker);
  pickerOverlay.addEventListener('click', closePicker);
  attachSwipeToClose(pickerSheet, pickerDragHandle, closePicker);

  // --- Forklaring av øvelse ---
  function openExplain() {
    if (!selectedExercise) return;
    explainTitle.textContent = selectedExercise.name;
    explainHowTo.textContent = selectedExercise.howTo;
    explainMuscles.textContent = selectedExercise.muscles;
    explainOverlay.classList.add('show');
    explainModal.classList.add('show');
  }
  function closeExplain() {
    explainOverlay.classList.remove('show');
    explainModal.classList.remove('show');
  }

  explainBtn.addEventListener('click', openExplain);
  explainCloseBtn.addEventListener('click', closeExplain);
  explainOverlay.addEventListener('click', closeExplain);

  // --- Navigasjon til/fra muskelside ---
  musclesNavBtn.addEventListener('click', () => {
    musclePage.classList.add('show');
    fab.style.display = 'none';
    renderMusclePage();
  });
  backFromMuscles.addEventListener('click', () => {
    musclePage.classList.remove('show');
    fab.style.display = 'flex';
  });

  bodyTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      bodyTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentBodyView = tab.dataset.view;
      renderBodyMap(currentBodyView, getCurrentWeekCounts());
    });
  });

  render();

  // --- Service worker (offline + installasjon) ---
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch((e) => {
        console.error('Service worker-registrering feilet:', e);
      });
    });
  }

  // --- "Legg til app"-banner (Chrome/Android) ---
  const installBanner = document.getElementById('installBanner');
  const installBtn = document.getElementById('installBtn');
  const installDismiss = document.getElementById('installDismiss');
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (!localStorage.getItem('momentum-install-dismissed')) {
      installBanner.classList.add('show');
    }
  });

  installBtn && installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBanner.classList.remove('show');
  });

  installDismiss && installDismiss.addEventListener('click', () => {
    installBanner.classList.remove('show');
    localStorage.setItem('momentum-install-dismissed', '1');
  });

  window.addEventListener('appinstalled', () => {
    installBanner.classList.remove('show');
  });
})();
</script>

</body>
</html>
